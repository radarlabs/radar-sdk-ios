name: Nightly ObjC to Swift migration

# Converts ONE safe Objective-C file to Swift per run and opens a PR for human
# review. Approval happens at PR review (see AGENTS.md "Language Policy") — the
# agent only picks conservative leaf files, and skips the run entirely while a
# previous migration PR is still open. The PR's own CI (build-and-test.yml on
# macOS) is the build/test verifier; this job runs on Linux and does not build.

on:
  schedule:
    # ~1-2am ET, Monday-Friday nights
    - cron: "0 6 * * 2-6"
  workflow_dispatch:

concurrency:
  group: objc-to-swift-nightly
  cancel-in-progress: false

# Pushes and PR creation use a GitHub App installation token, NOT the default
# GITHUB_TOKEN — PRs opened with GITHUB_TOKEN would not trigger the
# build-and-test.yml pull_request workflow that verifies the migration. The
# App is org-owned (not tied to any one person's PAT) via the
# radarlabs-swift-migration-bot GitHub App.
permissions:
  contents: read

jobs:
  migrate:
    # Run on the same platform as build-and-test.yml so the agent can compile
    # and test its migration before it creates a PR.
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MIGRATION_GH_APP_ID }}
          private-key: ${{ secrets.MIGRATION_GH_APP_PRIVATE_KEY }}
          owner: radarlabs
          repositories: radar-sdk-ios,clankers

      - name: Skip if a migration PR is already open (WIP cap = 1)
        id: guard
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          OPEN=$(gh pr list --repo "$GITHUB_REPOSITORY" --label swift-migration --state open --json number --jq 'length')
          echo "open=$OPEN" >> "$GITHUB_OUTPUT"
          if [ "$OPEN" != "0" ]; then
            echo "::notice::Skipping — $OPEN swift-migration PR(s) still open. Review/merge/close them to resume."
          fi

      - name: Checkout radar-sdk-ios
        if: steps.guard.outputs.open == '0'
        uses: actions/checkout@v5
        with:
          # GitHub App token (not GITHUB_TOKEN) so the pushed branch + PR trigger CI.
          token: ${{ steps.app-token.outputs.token }}
          # make lint-swift diffs against origin/master, which requires history.
          fetch-depth: 0
          # No submodules: the conversion only touches RadarSDK sources + pbxproj.

      - name: Checkout the objc-to-swift skill (radarlabs/clankers)
        if: steps.guard.outputs.open == '0'
        uses: actions/checkout@v5
        with:
          repository: radarlabs/clankers
          token: ${{ steps.app-token.outputs.token }}
          path: clankers-skill

      - name: Install the skill for this run
        if: steps.guard.outputs.open == '0'
        run: |
          mkdir -p .claude/skills
          cp -R clankers-skill/skills/objc-to-swift .claude/skills/objc-to-swift
          rm -rf clankers-skill

      - name: Use the PR CI Xcode version
        if: steps.guard.outputs.open == '0'
        run: |
          sudo xcode-select -switch /Applications/Xcode_26.3.app

      - name: Install Swift validation tools
        if: steps.guard.outputs.open == '0'
        run: brew install swift-format swiftlint

      - name: Pick an available iPhone simulator
        if: steps.guard.outputs.open == '0'
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices --json \
            | jq -r '
                .devices
                | to_entries
                | map(select(.key | startswith("com.apple.CoreSimulator.SimRuntime.iOS")))
                | .[]
                | .value[]
                | select(.isAvailable == true and (.name | test("iPhone")))
                | .udid
              ' | head -n 1)

          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator found"
            exit 1
          fi

          echo "MIGRATION_DESTINATION=platform=iOS Simulator,id=$SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: Run the migration agent
        if: steps.guard.outputs.open == '0'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          prompt: |
            /objc-to-swift batch

            This is the unattended nightly migration run. Follow the skill's
            "Batch mode (unattended CI runs)" section exactly:
            - The finder ranks most-trivial-first. Convert the single top
              flag-free candidate (smallest, least-coupled; Strategy D or A
              only), skipping Route*/Trip* clusters. If none is eligible, print
              why and exit WITHOUT editing anything or opening a PR.
            - You are on macOS with Xcode 26.3, swift-format, swiftlint, and
              plutil installed. Before pushing, you MUST verify the migration:
              1. Create a local commit on claude/migrate-<FileName> (do not
                 push yet), so make lint-swift can diff the committed changes
                 against origin/master.
              2. Run make lint-swift, make format-check, and
                 plutil -lint RadarSDK.xcodeproj/project.pbxproj.
              3. Run `make build DESTINATION="$MIGRATION_DESTINATION"` and
                 `make test DESTINATION="$MIGRATION_DESTINATION"`.
              4. If any command fails, diagnose and fix the migration, amend
                 the local commit, then rerun every failed check. Do not push
                 or open a PR unless all four checks pass. If validation is
                 unavailable, exit without pushing or opening a PR.
            - Only after successful validation, push and open a PR labeled
              swift-migration using gh (GH_TOKEN is set), filling
              .github/PULL_REQUEST_TEMPLATE.md. In the PR description, report
              the commands that passed; do not claim validation was skipped.
          claude_args: '--allowedTools "Bash,Read,Write,Edit,Glob,Grep" --max-turns 80'
