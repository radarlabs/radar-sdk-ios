name: Nightly ObjC to Swift migration

# Converts ONE deterministic, eligible Objective-C implementation to Swift per run
# and opens a PR for human review. Approval happens at PR review (see AGENTS.md
# "Language Policy"). The skill replaces the selected implementation while preserving
# its Objective-C contract. This job runs the same macOS validation as PR CI before
# publication; PR CI remains the independent verifier.

on:
  schedule:
    # ~1-2am ET, Monday-Friday nights
    - cron: "0 6 * * 2-6"
  workflow_dispatch:

concurrency:
  group: objc-to-swift-nightly
  cancel-in-progress: false

# Pushes and PR creation use a GitHub App installation token, NOT the default
# GITHUB_TOKEN — PRs opened with GITHUB_TOKEN would not trigger the
# build-and-test.yml pull_request workflow that verifies the migration. The
# App is org-owned (not tied to any one person's PAT) via the
# radarlabs-swift-migration-bot GitHub App.
permissions:
  contents: read

jobs:
  migrate:
    # Run on the same platform as build-and-test.yml so the agent can compile
    # and test its migration before it creates a PR.
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MIGRATION_GH_APP_ID }}
          private-key: ${{ secrets.MIGRATION_GH_APP_PRIVATE_KEY }}
          owner: radarlabs
          repositories: radar-sdk-ios,clankers

      - name: Skip if a migration PR is already open (WIP cap = 1)
        id: guard
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          OPEN=$(gh pr list --repo "$GITHUB_REPOSITORY" --label swift-migration --state open --json number --jq 'length')
          echo "open=$OPEN" >> "$GITHUB_OUTPUT"
          if [ "$OPEN" != "0" ]; then
            echo "::notice::Skipping — $OPEN swift-migration PR(s) still open. Review/merge/close them to resume."
          fi

      - name: Checkout radar-sdk-ios
        if: steps.guard.outputs.open == '0'
        uses: actions/checkout@v5
        with:
          # GitHub App token (not GITHUB_TOKEN) so the pushed branch + PR trigger CI.
          token: ${{ steps.app-token.outputs.token }}
          # make lint-swift diffs against origin/master, which requires history.
          fetch-depth: 0
          # No submodules: the conversion only touches RadarSDK sources + pbxproj.

      - name: Checkout the objc-to-swift skill (radarlabs/clankers)
        if: steps.guard.outputs.open == '0'
        uses: actions/checkout@v5
        with:
          repository: radarlabs/clankers
          token: ${{ steps.app-token.outputs.token }}
          path: clankers-skill

      - name: Install the skill for this run
        if: steps.guard.outputs.open == '0'
        run: |
          # The skill is runtime input from clankers, not a migration change.
          # Keep other checked-in Claude skills visible to Git.
          printf '%s\n' '.claude/skills/objc-to-swift/' >> .git/info/exclude
          mkdir -p .claude/skills
          cp -R clankers-skill/skills/objc-to-swift .claude/skills/objc-to-swift
          rm -rf clankers-skill

      - name: Select deterministic migration target
        id: candidate
        if: steps.guard.outputs.open == '0'
        run: |
          TARGET="$(bash .claude/skills/objc-to-swift/scripts/find-next-candidate.sh "$GITHUB_WORKSPACE")"
          if [ -z "$TARGET" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No eligible Objective-C implementation remains; skipping migration."
            exit 0
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "MIGRATION_TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "Selected $TARGET"

      - name: Use the PR CI Xcode version
        if: steps.guard.outputs.open == '0' && steps.candidate.outputs.available == 'true'
        run: |
          sudo xcode-select -switch /Applications/Xcode_26.3.app

      - name: Install Swift validation tools
        if: steps.guard.outputs.open == '0' && steps.candidate.outputs.available == 'true'
        run: brew install swift-format swiftlint

      - name: Pick an available iPhone simulator
        if: steps.guard.outputs.open == '0' && steps.candidate.outputs.available == 'true'
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices --json \
            | jq -r '
                .devices
                | to_entries
                | map(select(.key | startswith("com.apple.CoreSimulator.SimRuntime.iOS")))
                | .[]
                | .value[]
                | select(.isAvailable == true and (.name | test("iPhone")))
                | .udid
              ' | head -n 1)

          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator found"
            exit 1
          fi

          echo "MIGRATION_DESTINATION=platform=iOS Simulator,id=$SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: Run the migration agent
        if: steps.guard.outputs.open == '0' && steps.candidate.outputs.available == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MIGRATION_TARGET: ${{ steps.candidate.outputs.target }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          prompt: |
            /objc-to-swift batch

            Convert exactly the preselected file at
            ${{ steps.candidate.outputs.target }}. Do not select another file or leave
            the Objective-C implementation beside the Swift replacement. The workflow
            provides MIGRATION_TARGET, GH_TOKEN, and MIGRATION_DESTINATION.
          claude_args: '--allowedTools "Bash,Read,Write,Edit,Glob,Grep" --max-turns 80'
