name: Xcode - Build, Analyze, & Test

on:
  pull_request:
  merge_group:
    types: [checks_requested]

# Cancel superseded runs when a PR branch is re-pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  format:
    name: Format Swift
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # swift-format ships with the Swift toolchain, so this image tag pins its version: Homebrew and
    # runner-image updates can't change it. Bump the tag on purpose to upgrade.
    container:
      image: swift:6.3.3-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The PR's merge commit and its first parent (the base branch), to list the files the PR
          # changed. Works for stacked PRs too, since the parent is whatever branch the PR targets.
          fetch-depth: 2

      - name: Check format of changed Swift files
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "swift-format $(swift-format --version)"
          FILES=$(git diff --diff-filter=ACMR --name-only HEAD^1 HEAD -- '*.swift')
          if [ -z "$FILES" ]; then
            echo "No Swift files changed; skipping format check."
            exit 0
          fi
          echo "Checking format of:"
          echo "$FILES"
          echo "$FILES" | xargs swift-format format --in-place --parallel
          if ! git diff --exit-code -- $FILES; then
            echo "::error::These files don't match swift-format. Run swift-format on them, or apply the diff above."
            exit 1
          fi

  build:
    name: Build and analyse default scheme using xcodebuild command
    # This is the required check, so it carries the format result: it waits for the format job and
    # fails if that failed. (A job skipped because a dependency failed would count as passing.)
    needs: format
    if: ${{ !cancelled() }}
    runs-on: macos-15

    steps:
      - name: Require a passing format check
        if: needs.format.result == 'failure'
        run: |
          echo "::error::The Format Swift job failed. See its log for the diff."
          exit 1

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          # Org level secret
          token: ${{ secrets.SUBMODULESTOKEN }}

      - name: Use Xcode 26.3
        run: sudo xcode-select -switch /Applications/Xcode_26.3.app

      - name: Lint Swift
        run: |
          if ! command -v swiftlint >/dev/null; then
            brew install swiftlint
          fi
          swiftlint lint --strict --baseline .swiftlint-baseline.json

      - name: Pick an available iPhone simulator
        id: pick_sim
        run: |
          # Get a UDID for a valid iPhone simulator only (exclude iPads, Apple Watch, tvOS, etc)
          SIM_ID=$(xcrun simctl list devices --json \
            | jq -r '
                .devices
                | to_entries
                # Filter keys for iOS runtimes only (ignore tvOS/watchOS)
                | map(select(.key | startswith("com.apple.CoreSimulator.SimRuntime.iOS")))
                | .[]
                .value[]
                # Only devices available AND name contains "iPhone"
                | select(.isAvailable == true and (.name | test("iPhone")))
                .udid
            ' | head -n 1)

          if [ -z "$SIM_ID" ]; then
            echo "No available iPhone simulator found"
            exit 1
          fi

          echo "SIMULATOR_ID=$SIM_ID" >> $GITHUB_ENV
          echo "Picked iPhone simulator UDID: $SIM_ID"

      - name: Build and Analyze
        env:
          SIMULATOR_ID: ${{ env.SIMULATOR_ID }}
          scheme: RadarSDK
        run: |
          make ci-build-analyze CI_DESTINATION="platform=iOS Simulator,id=${SIMULATOR_ID}"

      - name: Test
        env:
          SIMULATOR_ID: ${{ env.SIMULATOR_ID }}
          scheme: RadarSDK
        run: |
          make ci-test-pretty CI_DESTINATION="platform=iOS Simulator,id=${SIMULATOR_ID}"
        
      - name: Test swift
        env:
          SIMULATOR_ID: ${{ env.SIMULATOR_ID }}
          scheme: RadarSDK
        run: |
          make ci-test-swift CI_DESTINATION="platform=iOS Simulator,id=${SIMULATOR_ID}"

      - name: Build example app
        env:
          SIMULATOR_ID: ${{ env.SIMULATOR_ID }}
        run: |
          make ci-build-example CI_DESTINATION="platform=iOS Simulator,id=${SIMULATOR_ID}"

      - name: Check for async-import completion-handler thunks
        run: make check-async-thunks

      - name: Lint podspecs
        run: make lint
