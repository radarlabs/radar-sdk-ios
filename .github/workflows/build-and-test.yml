name: Xcode - Build, Analyze, & Test

on:
  pull_request:
  merge_group:
    types: [checks_requested]

# Cancel superseded runs when a PR branch is re-pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  format:
    name: Format Swift
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # swift-format ships with the Swift toolchain, so this image tag pins its version: Homebrew and
    # runner-image updates can't change it. Bump the tag on purpose to upgrade.
    container:
      image: swift:6.3.3-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The PR's merge commit and its first parent (the base branch), to list the files the PR
          # changed. Works for stacked PRs too, since the parent is whatever branch the PR targets.
          fetch-depth: 2

      - name: Check format of changed Swift files
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "swift-format $(swift-format --version)"
          FILES=$(git diff --diff-filter=ACMR --name-only HEAD^1 HEAD -- '*.swift')
          if [ -z "$FILES" ]; then
            echo "No Swift files changed; skipping format check."
            exit 0
          fi
          echo "Checking format of:"
          echo "$FILES"
          echo "$FILES" | xargs swift-format format --in-place --parallel
          if ! git diff --exit-code -- $FILES; then
            echo "::error::These files don't match swift-format. Run swift-format on them, or apply the diff above."
            exit 1
          fi

  # The macOS work runs as three jobs in parallel, balanced so each takes a similar time. Each job
  # costs a macOS runner, and the org can run only a few at once, so keep the job count low.

  sdk-tests:
    name: Build, analyze, and test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          # Org level secret
          token: ${{ secrets.SUBMODULESTOKEN }}

      - name: Set up Xcode and simulator
        uses: ./.github/actions/setup-simulator

      - name: Build and Analyze
        run: make ci-build-analyze CI_DESTINATION="platform=iOS Simulator,id=${SIMULATOR_ID}"

      # Reuses the build products from Build and Analyze.
      - name: Test
        run: make ci-test-pretty CI_DESTINATION="platform=iOS Simulator,id=${SIMULATOR_ID}"

  swift-tests-and-lint:
    name: Test swift and lint
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          # Org level secret
          token: ${{ secrets.SUBMODULESTOKEN }}

      - name: Set up Xcode and simulator
        uses: ./.github/actions/setup-simulator

      - name: Lint Swift
        run: |
          if ! command -v swiftlint >/dev/null; then
            brew install swiftlint
          fi
          swiftlint lint --strict --baseline .swiftlint-baseline.json

      # The suites that `make ci-test-pretty` skips. They run in their own xcodebuild invocation,
      # so a separate runner works too.
      - name: Test swift
        run: make ci-test-swift CI_DESTINATION="platform=iOS Simulator,id=${SIMULATOR_ID}"

      - name: Lint podspecs
        run: make lint

  example:
    name: Build example app
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          # Org level secret
          token: ${{ secrets.SUBMODULESTOKEN }}

      - name: Set up Xcode and simulator
        uses: ./.github/actions/setup-simulator

      - name: Build example app
        run: make ci-build-example CI_DESTINATION="platform=iOS Simulator,id=${SIMULATOR_ID}"

      # Reads the object files from the example build's DerivedData, so it must stay in this job.
      - name: Check for async-import completion-handler thunks
        run: make check-async-thunks

  build:
    # This is the required check. It keeps its old name so branch protection and the merge queue
    # don't need updating, and it passes only if every job above passed. A job skipped because a
    # dependency failed counts as passing, so check each result instead of relying on `needs`.
    # Format is skipped in the merge queue, which is fine.
    name: Build and analyse default scheme using xcodebuild command
    needs: [format, sdk-tests, swift-tests-and-lint, example]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          FAILED=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key')
          if [ -n "$FAILED" ]; then
            echo "::error::These jobs didn't pass: $(echo $FAILED)"
            exit 1
          fi
